[package]
name = "mlat-ng"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "FlyItalyADSB multilateration (MLAT) server: Mode S, one process for the whole network, wire-compatible with mlat-client"
repository = "https://github.com/flyitalyadsb/mlat-ng"
homepage = "https://flyitalyadsb.com/en/"

[[bin]]
name = "mlat-ng"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1"
foldhash = "0.1"
hex = "0.4"
nalgebra = "0.33"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly rounded float parsing, as ujson (double-conversion)
# and CPython float() do; only the non-hot slow path parses floats.
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
